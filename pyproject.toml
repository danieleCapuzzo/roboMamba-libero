[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robomamba-libero"
version = "0.1.0"
description = "RoboMamba trunk + LIBERO action-chunking head: training and fine-tuning"
readme = "readme.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }

dependencies = [
    "transformers==4.40.1",
    "tokenizers==0.19.1",
    "sentencepiece==0.1.99",
    "timm==0.9.10",
    "peft==0.11.1",
    "accelerate==0.30.1",
    "safetensors==0.8.0",
    "huggingface_hub==0.36.2",
    "h5py==3.16.0",
    "opencv-python==4.6.0.66",
    "numpy==1.26.4",
    "tqdm==4.70.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
